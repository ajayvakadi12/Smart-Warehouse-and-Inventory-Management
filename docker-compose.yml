version : '3.7'

services:
    frontend:
      build: ./frontend
      container_name: frontend_service
      ports:
        - "5173:80"
      depends_on:
        - backend

    backend:
      build: ./backend
      container_name: backend_service
      ports:
        - "5000:5000"
      environment:
        - MONGO_URI=mongodb://mongo:27017/mern_db
      depends_on:
        - mongo
      
    mongo:
      image: mongo:6.0
      container_name: mongo_db
      ports:
        - "27017:27017"
      volumes:
        - mongo_data: /data/db

volumes:
  mongo_data: